[package]
name = "pulse-core"
description = "Platform abstraction, sampling engine and data models for the Pulse system monitor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
sysinfo = { version = "0.40", default-features = false, features = ["system", "disk", "network", "component", "user", "gpu"] }
nvml-wrapper = "0.13"
csv = "1.3"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }

# HTTPS client for the user-initiated update check / download (see update.rs).
# Linux: rustls with the system certificate store. Windows: the OS's own TLS
# (SChannel) and proxy settings.
[target.'cfg(not(windows))'.dependencies]
ureq = { version = "3.5", default-features = false, features = ["rustls", "platform-verifier"] }

[target.'cfg(windows)'.dependencies.ureq]
version = "3.5"
default-features = false
features = ["native-tls", "win-system-proxy"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
wmi = "0.18"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_System_Performance",
  "Win32_System_ProcessStatus",
  "Win32_Security",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
