[package]
name = "pulse"
description = "Pulse — a fast, monochrome, cross-platform system monitor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
default-run = "pulse"

[lib]
name = "pulse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
pulse-core = { path = "../crates/pulse-core" }
serde.workspace = true
parking_lot.workspace = true
log.workspace = true
env_logger = "0.11"
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-notification = "2.3"
tauri-plugin-dialog = "2.3"
tauri-plugin-opener = "2.4"
tauri-plugin-single-instance = "2.3"
